[project]
name = "birthweight-api"
version = "1.0.0"
description = "FastAPI service that predicts newborn birth weight (kg) from maternity register fields"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "scikit-learn==1.6.1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "joblib>=1.4",
]

[tool.uv]
package = false
