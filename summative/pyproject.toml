[project]
name = "birthweight-notebook"
version = "1.0.0"
description = "Notebook environment for the birth weight regression models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-learn==1.6.1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.4",
    "openpyxl>=3.1",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.uv]
package = false
